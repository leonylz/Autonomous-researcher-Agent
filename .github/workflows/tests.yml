name: tests

# Unit test suite — runs on every push / PR to main so regressions
# are caught in CI instead of on the interviewer's machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest fastapi uvicorn

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify CLI entry points
        run: |
          python -m core.nodes --check --project examples/mnist_clean
          python -m core.dashboard --help

  # Windows 是本项目主力开发平台(实测暴露过 sqlite 锁/进程句柄类问题),
  # 固定跑一份保证跨平台不回归
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest fastapi uvicorn

      - name: Run test suite
        run: python -m pytest -q -m "not slow"
