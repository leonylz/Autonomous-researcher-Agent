[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-deep-researcher"
version = "0.1.0"
description = "24/7 autonomous deep learning experiment agent (LangGraph rewrite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0", "openai>=1.30.0"]
agent = ["langgraph>=1.0", "langchain>=1.0", "langchain-core>=1.0", "langchain-openai>=1.0"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
eval = ["sentence-transformers>=2.2", "faiss-cpu>=1.7"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["core", "gpu"]

[tool.pytest.ini_options]
markers = ["slow: long-running integration tests (run with -m 'not slow' to skip)"]
